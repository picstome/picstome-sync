[workspace]
resolver = "2"
members = ["crates/picstome-sync-core", "src-tauri"]

[workspace.package]
version = "0.1.12"
edition = "2021"
license = "MIT"
authors = ["Picstome"]
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "time", "io-util", "net", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
url = "2"
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
rand = "0.8"
axum = { version = "0.7", features = ["multipart"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
