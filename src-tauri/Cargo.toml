[package]
name = "picstome-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Picstome Sync desktop app"

[lib]
name = "picstome_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
picstome-sync-core = { path = "../crates/picstome-sync-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
hex.workspace = true
tempfile = "3"
rand.workspace = true
url.workspace = true
base64 = "0.22"
futures.workspace = true

# The API token is kept in the OS credential store when one is available:
# Windows Credential Manager, macOS Keychain, or the Linux Secret Service.
# Linux uses the pure-Rust zbus backend (no libdbus build dependency) and is
# always called from a blocking thread. Scripts and headless machines can set
# PICSTOME_DISABLE_KEYRING=1 to fall back to the 0600 auth.json file.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = [
    "async-secret-service",
    "crypto-rust",
    "tokio",
] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
