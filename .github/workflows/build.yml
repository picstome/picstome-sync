name: build

# Manual test builds. Compiles Linux, macOS and Windows and optionally updates a
# draft release. Nothing runs automatically on push; final releases use
# release.yml manually.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional draft tag (defaults to v<app version>)"
        required: false
        default: ""
      create_release:
        description: "Create/update the draft release (otherwise only upload artifacts)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-manual-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4

jobs:
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Create/update draft release notes
        if: inputs.create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          bash scripts/release-notes.sh "$TAG" > release-notes.md
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --draft \
              --title "Picstome Sync $TAG" \
              --notes-file release-notes.md
          else
            gh release edit "$TAG" --notes-file release-notes.md
          fi

  macos:
    needs: prepare
    name: macOS universal test build
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install macOS targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build unsigned universal app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin
      - name: Upload DMG to draft release
        if: inputs.create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ needs.prepare.outputs.tag }}" \
            target/universal-apple-darwin/release/bundle/dmg/*.dmg --clobber
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: picstome-sync-macos-universal-${{ github.sha }}
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux test build
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libssl-dev build-essential
      - name: Build Linux installers
        run: npx --yes @tauri-apps/cli@2 build --bundles deb,appimage
      - name: Upload installers to draft release
        if: inputs.create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          UPLOAD_DIR="target/release-upload"
          rm -rf "$UPLOAD_DIR"
          mkdir -p "$UPLOAD_DIR"
          for file in target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage; do
            cp "$file" "$UPLOAD_DIR/$(basename "$file" | tr ' ' '.')"
          done
          gh release upload "${{ needs.prepare.outputs.tag }}" "$UPLOAD_DIR"/* --clobber
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: picstome-sync-linux-${{ github.sha }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows test build
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Windows installers
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis,msi
      - name: Upload installers to draft release
        if: inputs.create_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(target/release/bundle/nsis/*.exe target/release/bundle/msi/*.msi)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No Windows installer produced" >&2
            exit 1
          fi
          gh release upload "${{ needs.prepare.outputs.tag }}" "${FILES[@]}" --clobber
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: picstome-sync-windows-${{ github.sha }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30
