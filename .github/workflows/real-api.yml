name: real-api

on:
  workflow_dispatch:
    inputs:
      write:
        description: "Exercise upload + delete round-trip on the real gallery"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: real-api-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PICSTOME_API_BASE: ${{ vars.PICSTOME_REAL_API }}
  PICSTOME_TOKEN: ${{ secrets.PICSTOME_REAL_TOKEN }}
  PICSTOME_REAL_API: ${{ vars.PICSTOME_REAL_API }}
  PICSTOME_REAL_TOKEN: ${{ secrets.PICSTOME_REAL_TOKEN }}
  PICSTOME_REAL_GALLERY: ${{ vars.PICSTOME_REAL_GALLERY }}

jobs:
  engine:
    name: engine against real API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Engine E2E
        run: cargo run -p picstome-sync-core --bin real-api-smoke
        env:
          PICSTOME_REAL_WRITE: ${{ inputs.write && '1' || '0' }}

  app:
    name: Tauri UI against real API
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libssl-dev build-essential \
            xvfb xauth webkit2gtk-driver libgbm1 libasound2t64 \
            || sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
              librsvg2-dev patchelf libxdo-dev libssl-dev build-essential \
              xvfb xauth webkit2gtk-driver libgbm1 libasound2
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      - name: Build app
        run: cargo build -p picstome-sync
      - name: Run UI E2E against the real API
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" python3 scripts/e2e.py
        env:
          E2E_MOCK: "0"
          E2E_WRITE: ${{ inputs.write && '1' || '0' }}
          E2E_GALLERY: ${{ vars.PICSTOME_REAL_GALLERY }}
