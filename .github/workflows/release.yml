name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+*"
      - "v[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p picstome-sync-core --all-targets -- -D warnings
      - run: cargo test -p picstome-sync-core

  publish:
    needs: check
    name: publish (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            args: ""
          - name: macos-universal
            os: macos-15-intel
            args: "--target universal-apple-darwin"
          # Windows is intentionally part of FINAL releases only. Test Windows
          # builds are disabled until the app is stable; add a windows job to
          # build.yml at that point.
          - name: windows
            os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install macOS targets
        if: matrix.name == 'macos-universal'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install Tauri Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libssl-dev build-essential
      - name: Build and attach release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Picstome Sync ${{ inputs.tag || github.ref_name }}"
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          releaseBody: |
            Picstome Sync ${{ inputs.tag || github.ref_name }}

            Builds are ad-hoc signed (no Apple Developer ID). If macOS says the
            app is damaged or from an unidentified developer:

            1. Right-click the app in Finder and choose **Open**.
            2. If needed, run `xattr -cr "/Applications/Picstome Sync.app"`.
            3. Approve it in **System Settings → Privacy & Security**.

            The app shows its version, build profile and exact API URL under the
            **Info** button in the sidebar. Use **Test API target** there to switch
            between production (`app.picstome.com`) and development
            (`devel.picstome.com`); switching signs you out.

            The Sync button checks remote changes and shows live progress. When the
            API reports favorite photos, Sync asks for a 1–5 star rating before
            writing it locally. If a photo was deleted in Picstome, Sync asks
            whether to delete it locally, keep it locally or upload it again. The
            old Rate tab is now a rating dialog inside the same desktop interface.
            Rate links use the selected gallery folder automatically, and the
            gallery sidebar has search (Ctrl/Cmd+F).
          args: ${{ matrix.args }}
