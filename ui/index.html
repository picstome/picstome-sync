<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'; connect-src 'self' ipc: http://ipc.localhost"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Picstome Sync</title>
        <link rel="icon" type="image/png" href="./assets/picstome-sync-logo.png" />
        <link rel="stylesheet" href="./styles.css" />
    </head>
    <body>
        <div class="app-shell">
            <aside class="sidebar">
                <div class="sidebar-brand">
                    <img
                        class="brand-logo"
                        src="./assets/picstome-sync-logo.png"
                        alt="Picstome Sync"
                    />
                    <div class="brand-text">
                        <span class="brand-name">Picstome Sync</span>
                        <span class="env-badge hidden" id="envBadge"></span>
                    </div>
                </div>

                <div class="sidebar-heading">
                    <span id="galleriesLabel">Galleries</span>
                    <button
                        type="button"
                        class="icon-button"
                        id="btnAddGallery"
                        title="Open Picstome"
                    >
                        +
                    </button>
                </div>

                <div class="gallery-list" id="galleryList"></div>

                <div class="sidebar-empty hidden" id="syncEmpty">
                    <p class="empty-title" id="emptyTitle">
                        No synced galleries yet
                    </p>
                    <p class="hint" id="emptyHint"></p>
                    <button type="button" class="secondary small" id="btnDemo">
                        Sync demo gallery
                    </button>
                </div>

                <div class="sidebar-spacer"></div>

                <div class="sidebar-footer">
                    <button
                        type="button"
                        class="account-button"
                        id="accountChip"
                        title="Open account profile"
                    >
                        <span class="account-avatar" id="accountInitial">?</span>
                        <span class="account-text">
                            <span class="account-name" id="accountName"
                                >Not connected</span
                            >
                            <span class="account-email" id="accountEmail"></span>
                        </span>
                    </button>
                    <div class="sidebar-actions">
                        <button
                            type="button"
                            class="primary small"
                            id="btnConnect"
                        >
                            Open Picstome
                        </button>
                        <button
                            type="button"
                            class="ghost small hidden"
                            id="btnLogout"
                        >
                            Log out
                        </button>
                        <button type="button" class="ghost small" id="btnInfo">
                            Info
                        </button>
                    </div>
                </div>
            </aside>

            <main class="main-pane">
                <header class="main-header">
                    <div class="main-title">
                        <h1 id="detailName">Picstome Sync</h1>
                        <p class="hint" id="detailPath"></p>
                        <p class="hint subtle" id="detailLastSync"></p>
                    </div>
                    <div class="main-actions">
                        <button type="button" class="primary" id="btnSync">
                            Sync
                        </button>
                        <button
                            type="button"
                            class="secondary"
                            id="btnChangeFolder"
                        >
                            Change folder…
                        </button>
                        <button
                            type="button"
                            class="secondary"
                            id="btnOpenFolder"
                        >
                            Open folder
                        </button>
                        <button
                            type="button"
                            class="ghost"
                            id="btnUnlink"
                        >
                            Unlink
                        </button>
                    </div>
                </header>

                <section class="main-content">
                    <div class="idle-card hidden" id="idleState">
                        <div class="idle-icon">⟳</div>
                        <h2 id="idleTitle">Ready to sync</h2>
                        <p class="hint" id="idleHint"></p>
                        <button type="button" class="primary" id="btnIdleSync">
                            Sync
                        </button>
                    </div>

                    <div class="welcome" id="welcome">
                        <h2 id="welcomeTitle">Select a gallery</h2>
                        <p class="hint" id="welcomeHint"></p>
                        <div class="btn-row">
                            <button
                                type="button"
                                class="primary"
                                id="btnConnectWelcome"
                            >
                                Open Picstome
                            </button>
                            <button
                                type="button"
                                class="secondary"
                                id="btnDemoWelcome"
                            >
                                Sync demo gallery
                            </button>
                        </div>
                    </div>

                    <div class="progress-card hidden" id="progressWrap">
                        <div class="progress-head">
                            <span id="progressTitle">Syncing…</span>
                            <span class="progress-percent" id="progressPercent"
                                >0%</span
                            >
                        </div>
                        <div class="progress-bar" id="progressBar">
                            <span id="progressFill"></span>
                        </div>
                        <div class="progress-text" id="progressText"></div>
                    </div>

                    <div class="report hidden" id="report">
                        <div class="report-head">
                            <span id="reportSummary"></span>
                            <span class="subtle" id="reportTime"></span>
                        </div>
                        <div class="counts" id="reportCounts"></div>
                        <div class="report-errors" id="reportErrors"></div>

                        <div class="delete-box hidden" id="deleteBox">
                            <div class="delete-title" id="deleteTitle"></div>
                            <p class="hint" id="deleteHint"></p>
                            <div class="delete-list" id="deleteList"></div>
                            <div class="btn-row">
                                <button
                                    type="button"
                                    class="danger"
                                    id="btnDeleteRemote"
                                >
                                    Delete in Picstome
                                </button>
                                <button
                                    type="button"
                                    class="ghost"
                                    id="btnCancelDelete"
                                >
                                    Cancel
                                </button>
                            </div>
                        </div>
                    </div>
                </section>
            </main>
        </div>

        <div class="modal-backdrop hidden" id="infoModal">
            <div class="modal" role="dialog" aria-modal="true">
                <div class="modal-head">
                    <h2 id="infoTitle">Build information</h2>
                    <button type="button" class="ghost small" id="btnInfoClose">
                        Close
                    </button>
                </div>
                <dl class="info-list">
                    <div>
                        <dt id="infoVersionLabel">Version</dt>
                        <dd id="infoVersion"></dd>
                    </div>
                    <div>
                        <dt id="infoProfileLabel">Build</dt>
                        <dd id="infoProfile"></dd>
                    </div>
                    <div>
                        <dt id="infoModeLabel">Mode</dt>
                        <dd id="infoMode"></dd>
                    </div>
                    <div>
                        <dt id="infoTargetLabel">API target</dt>
                        <dd><code id="infoTarget"></code></dd>
                    </div>
                    <div>
                        <dt id="infoAccountLabel">Account</dt>
                        <dd id="infoAccount"></dd>
                    </div>
                </dl>
                <div class="api-switch">
                    <div class="api-switch-title" id="apiSwitchTitle">
                        Test API target
                    </div>
                    <div class="btn-row">
                        <button
                            type="button"
                            class="secondary small"
                            id="btnApiProduction"
                        >
                            Production
                        </button>
                        <button
                            type="button"
                            class="secondary small"
                            id="btnApiDevelopment"
                        >
                            Development
                        </button>
                    </div>
                    <p class="hint" id="apiSwitchHint"></p>
                </div>
            </div>
        </div>

        <div class="modal-backdrop hidden" id="ratingModal">
            <div class="modal rating-modal" role="dialog" aria-modal="true">
                <div class="modal-head">
                    <h2 id="ratingTitle">Rate photos</h2>
                    <button
                        type="button"
                        class="ghost small"
                        id="btnRatingClose"
                    >
                        Close
                    </button>
                </div>
                <p class="hint" id="ratingSubtitle"></p>
                <div class="rating-target" id="ratingTarget"></div>
                <button
                    type="button"
                    class="secondary small hidden"
                    id="btnRatingFolder"
                >
                    Choose folder…
                </button>

                <div class="rating-stars" id="ratingStars">
                    <button type="button" class="star-btn" data-rating="1">
                        ★
                    </button>
                    <button type="button" class="star-btn" data-rating="2">
                        ★
                    </button>
                    <button type="button" class="star-btn" data-rating="3">
                        ★
                    </button>
                    <button type="button" class="star-btn" data-rating="4">
                        ★
                    </button>
                    <button type="button" class="star-btn" data-rating="5">
                        ★
                    </button>
                    <strong id="ratingValue">5</strong>
                </div>

                <div class="rating-result hidden" id="ratingResult"></div>

                <div class="btn-row">
                    <button type="button" class="primary" id="btnRatingApply">
                        Apply rating
                    </button>
                    <button type="button" class="ghost" id="btnRatingCancel">
                        Not now
                    </button>
                </div>
            </div>
        </div>

        <script src="./renderer.js"></script>
    </body>
</html>
