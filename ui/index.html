<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'; connect-src 'self' ipc: http://ipc.localhost"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Picstome Sync</title>
        <link rel="icon" type="image/png" href="./assets/picstome-sync-logo.png" />
        <link rel="stylesheet" href="./styles.css" />
    </head>
    <body>
        <!--
            Icon sprite. Every icon is a 24x24 stroke drawing referenced with
            <svg class="icon"><use href="#i-NAME"/></svg>, so icons inherit the
            text colour and size of their button and look identical on macOS,
            Windows and Linux (emoji glyphs did not).
        -->
        <svg class="icon-sprite" aria-hidden="true" focusable="false">
            <symbol id="i-sync" viewBox="0 0 24 24">
                <path d="M21 12a9 9 0 0 0-15.4-6.4L3 8" />
                <path d="M3 3v5h5" />
                <path d="M3 12a9 9 0 0 0 15.4 6.4L21 16" />
                <path d="M16 16h5v5" />
            </symbol>
            <symbol id="i-plus" viewBox="0 0 24 24">
                <path d="M12 5v14M5 12h14" />
            </symbol>
            <symbol id="i-external" viewBox="0 0 24 24">
                <path d="M15 3h6v6" />
                <path d="M10 14 21 3" />
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
            </symbol>
            <symbol id="i-folder" viewBox="0 0 24 24">
                <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" />
            </symbol>
            <symbol id="i-folder-open" viewBox="0 0 24 24">
                <path d="m6 14 1.5-2.9A2 2 0 0 1 9.2 10H20a2 2 0 0 1 1.9 2.5l-1.5 6a2 2 0 0 1-2 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.7.9l.8 1.2a2 2 0 0 0 1.7.9H18a2 2 0 0 1 2 2v2" />
            </symbol>
            <symbol id="i-unlink" viewBox="0 0 24 24">
                <path d="m18.8 12.3 1.7-1.7a5 5 0 0 0-7.1-7.1l-1.7 1.7" />
                <path d="m5.2 11.7-1.7 1.7a5 5 0 0 0 7.1 7.1l1.7-1.7" />
                <path d="M8 2v3M2 8h3M16 22v-3M22 16h-3" />
            </symbol>
            <symbol id="i-heart" viewBox="0 0 24 24">
                <path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z" />
            </symbol>
            <symbol id="i-star" viewBox="0 0 24 24">
                <path d="M11.5 2.3a.5.5 0 0 1 1 0l2.5 5.2 5.7.8a.5.5 0 0 1 .3.9l-4.1 4 1 5.7a.5.5 0 0 1-.8.5L12 16.8l-5.1 2.7a.5.5 0 0 1-.8-.5l1-5.7-4.1-4a.5.5 0 0 1 .3-.9l5.7-.8Z" />
            </symbol>
            <symbol id="i-cloud" viewBox="0 0 24 24">
                <path d="M17.5 19H9a7 7 0 1 1 6.7-9h1.8a4.5 4.5 0 1 1 0 9Z" />
            </symbol>
            <symbol id="i-home" viewBox="0 0 24 24">
                <path d="M3 10.5 12 3l9 7.5" />
                <path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5" />
            </symbol>
            <symbol id="i-cloud-off" viewBox="0 0 24 24">
                <path d="m2 2 20 20" />
                <path d="M5.8 5.8A7 7 0 0 0 9 19h8.5a4.5 4.5 0 0 0 1.3-.2" />
                <path d="M21.5 16.6A4.5 4.5 0 0 0 17.5 10h-1.8a7 7 0 0 0-5.3-4.9" />
            </symbol>
            <symbol id="i-logout" viewBox="0 0 24 24">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <path d="m16 17 5-5-5-5" />
                <path d="M21 12H9" />
            </symbol>
            <symbol id="i-info" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" />
                <path d="M12 16v-4M12 8h.01" />
            </symbol>
            <symbol id="i-chevron" viewBox="0 0 24 24">
                <path d="m9 18 6-6-6-6" />
            </symbol>
            <symbol id="i-search" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="7" />
                <path d="m20 20-3.5-3.5" />
            </symbol>
            <symbol id="i-check" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" />
                <path d="m8.5 12 2.5 2.5 4.5-5" />
            </symbol>
            <symbol id="i-alert" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" />
                <path d="M12 7.5v5M12 16.5h.01" />
            </symbol>
        </svg>

        <!--
            Layout: sidebar + main pane on top, one full-width app bar at the
            bottom. App-level actions (home, account, info) sit on its left;
            actions for the selected gallery on its right.
        -->
        <div class="app-shell">
            <div class="app-body">
            <aside class="sidebar">
                <div class="sidebar-top">
                    <div class="search-row">
                        <svg class="icon search-icon" aria-hidden="true"><use href="#i-search" /></svg>
                        <input
                            id="gallerySearch"
                            type="search"
                            autocomplete="off"
                            spellcheck="false"
                        />
                    </div>
                    <button
                        type="button"
                        class="icon-button add-button"
                        id="btnAddGallery"
                        title="Open Picstome"
                    >
                        <svg class="icon" aria-hidden="true"><use href="#i-plus" /></svg>
                    </button>
                </div>

                <div class="gallery-list" id="galleryList"></div>
                <div class="search-empty hidden" id="searchEmpty"></div>

                <div class="sidebar-empty hidden" id="syncEmpty">
                    <p class="empty-title" id="emptyTitle">
                        No synced galleries yet
                    </p>
                    <p class="hint" id="emptyHint"></p>
                    <button type="button" class="secondary small" id="btnDemo">
                        Sync demo gallery
                    </button>
                </div>

            </aside>

            <main class="main-pane">
                <header class="main-header">
                    <div class="main-title">
                        <div class="title-row">
                            <img
                                class="title-logo hidden"
                                id="titleLogo"
                                src="./assets/picstome-sync-logo.png"
                                alt=""
                            />
                            <h1 id="detailName">Picstome Sync</h1>
                            <button
                                type="button"
                                class="title-link"
                                id="btnOpenWebGallery"
                                title="Open gallery in Picstome"
                                aria-label="Open gallery in Picstome"
                            >
                                <svg class="icon" aria-hidden="true"><use href="#i-external" /></svg>
                            </button>
                        </div>
                        <div class="path-row" id="pathRow">
                            <button
                                type="button"
                                class="path-link"
                                id="detailPath"
                                title="Open folder"
                            >
                                <svg class="icon path-icon" aria-hidden="true"><use href="#i-folder" /></svg>
                                <span class="path-text" id="detailPathText"></span>
                            </button>
                        </div>
                        <div class="main-meta">
                            <span class="meta-pill" id="detailStats"></span>
                            <span class="meta-pill" id="detailLastSync"></span>
                            <button
                                type="button"
                                class="meta-pill meta-action hidden"
                                id="detailRawMode"
                            ></button>
                        </div>
                    </div>
                    <div class="main-actions" id="mainActions">
                        <button
                            type="button"
                            class="favorites-action"
                            id="btnFavoritesList"
                        >
                            <svg class="icon" aria-hidden="true"><use href="#i-heart" /></svg>
                            <span class="label">Favorites</span>
                        </button>
                        <button type="button" class="primary sync-action" id="btnSync">
                            <svg class="icon" aria-hidden="true"><use href="#i-sync" /></svg>
                            <span class="label">Sync</span>
                        </button>
                    </div>
                </header>

                <section class="main-content">
                    <div class="idle-card hidden" id="idleState">
                        <div class="idle-icon" aria-hidden="true">
                            <svg class="icon"><use href="#i-sync" /></svg>
                        </div>
                        <h2 id="idleTitle">Ready to sync</h2>
                        <p class="hint" id="idleHint"></p>
                        <button type="button" class="primary" id="btnIdleSync">
                            Sync
                        </button>
                    </div>

                    <div class="home hidden" id="home">
                        <section class="home-section" id="homeSyncedSection">
                            <div class="home-section-head">
                                <h2 id="homeSyncedTitle">Recently synced</h2>
                                <p class="hint" id="homeSyncedHint"></p>
                            </div>
                            <div class="home-grid" id="homeSynced"></div>
                        </section>
                        <section class="home-section" id="homeRemoteSection">
                            <div class="home-section-head">
                                <h2 id="homeRemoteTitle">New in Picstome</h2>
                                <p class="hint" id="homeRemoteHint"></p>
                            </div>
                            <div class="home-grid" id="homeRemote"></div>
                            <p class="hint home-status" id="homeRemoteStatus"></p>
                        </section>
                        <section class="home-empty hidden" id="homeEmpty">
                            <h2 id="homeEmptyTitle">Nothing to sync yet</h2>
                            <p class="hint" id="homeEmptyHint"></p>
                        </section>
                    </div>

                    <div class="welcome" id="welcome">
                        <h2 id="welcomeTitle">Select a gallery</h2>
                        <p class="hint" id="welcomeHint"></p>
                        <div class="btn-row">
                            <button
                                type="button"
                                class="primary"
                                id="btnConnectWelcome"
                            >
                                Open Picstome
                            </button>
                            <button
                                type="button"
                                class="secondary"
                                id="btnDemoWelcome"
                            >
                                Sync demo gallery
                            </button>
                        </div>
                    </div>

                    <div class="progress-card hidden" id="progressWrap">
                        <div class="progress-head">
                            <span id="progressTitle">Syncing…</span>
                            <span class="progress-percent" id="progressPercent"
                                >0%</span
                            >
                        </div>
                        <div class="progress-bar" id="progressBar">
                            <span id="progressFill"></span>
                        </div>
                        <div class="progress-text" id="progressText"></div>
                    </div>

                    <!-- Review: everything a sync would do, nothing applied yet. -->
                    <section class="review hidden" id="review">
                        <div class="review-head">
                            <h2 id="reviewTitle">Changes to review</h2>
                            <p class="hint" id="reviewHint"></p>
                        </div>
                        <div class="review-groups" id="reviewGroups"></div>
                    </section>

                    <div class="report hidden" id="report">
                        <div class="report-head">
                            <span class="report-title">
                                <svg class="icon report-icon" id="reportIcon" aria-hidden="true">
                                    <use id="reportIconUse" href="#i-check" />
                                </svg>
                                <span id="reportSummary"></span>
                            </span>
                            <span class="subtle" id="reportTime"></span>
                        </div>
                        <div class="counts" id="reportCounts"></div>
                        <div class="report-errors" id="reportErrors"></div>
                        <div class="report-warnings" id="reportWarnings"></div>
                        <div class="report-files" id="reportFiles"></div>
                        <p class="hint raw-note hidden" id="reportRaw"></p>
                        <div class="report-ignored hidden" id="reportIgnored">
                            <span id="reportIgnoredText"></span>
                            <button
                                type="button"
                                class="secondary small"
                                id="btnIncludeIgnored"
                            >
                                Include ignored again
                            </button>
                        </div>

</div>

                    <details class="log-card hidden" id="syncLog">
                        <summary>
                            <svg class="icon log-chevron" aria-hidden="true"><use href="#i-chevron" /></svg>
                            <span id="syncLogTitle">Activity log</span>
                            <span class="log-count" id="syncLogCount"></span>
                        </summary>
                        <div class="log-toolbar">
                            <button class="ghost small" id="btnClearLog" type="button">
                                Clear log
                            </button>
                        </div>
                        <div class="log-entries" id="syncLogEntries"></div>
                    </details>
                </section>

                <div class="review-bar hidden" id="reviewBar">
                    <span class="review-summary" id="reviewSummary"></span>
                    <div class="btn-row">
                        <button type="button" class="ghost" id="btnReviewDiscard">Discard</button>
                        <button type="button" class="primary" id="btnReviewApply">Apply</button>
                    </div>
                </div>
            </main>
            </div>

            <footer class="app-bar">
                <div class="app-bar-left">
                    <button
                        type="button"
                        class="bar-icon"
                        id="btnHome"
                        title="Home"
                        aria-label="Home"
                    >
                        <svg class="icon" aria-hidden="true"><use href="#i-home" /></svg>
                    </button>
                    <span class="bar-divider" aria-hidden="true"></span>
                    <!-- The account opens a small menu: profile, info and log out. -->
                    <div class="account-wrap">
                        <button
                            type="button"
                            class="account-button"
                            id="accountChip"
                            aria-haspopup="menu"
                            aria-expanded="false"
                        >
                            <span class="account-avatar" id="accountInitial"></span>
                            <span class="account-text">
                                <span class="account-name" id="accountName"
                                    >Not connected</span
                                >
                                <span class="account-email" id="accountEmail"></span>
                            </span>
                            <svg class="icon account-caret" id="accountCaret" aria-hidden="true">
                                <use href="#i-chevron" />
                            </svg>
                        </button>
                        <div class="account-menu hidden" id="accountMenu" role="menu">
                            <button type="button" role="menuitem" id="btnOpenProfile">
                                <svg class="icon" aria-hidden="true"><use href="#i-external" /></svg>
                                <span class="label">Open profile in Picstome</span>
                            </button>
                            <button type="button" role="menuitem" id="btnInfo">
                                <svg class="icon" aria-hidden="true"><use href="#i-info" /></svg>
                                <span class="label">Info</span>
                            </button>
                            <span class="menu-separator" id="menuLogoutSeparator"></span>
                            <button
                                type="button"
                                role="menuitem"
                                class="menu-danger"
                                id="btnLogout"
                            >
                                <svg class="icon" aria-hidden="true"><use href="#i-logout" /></svg>
                                <span class="label">Log out</span>
                            </button>
                        </div>
                    </div>
                    <button type="button" class="primary small" id="btnConnect">
                        Open Picstome
                    </button>
                    <span class="env-badge hidden" id="envBadge"></span>
                </div>
                <div class="app-bar-right" id="mainFooter">
                    <button type="button" class="footer-action" id="btnChangeFolder">
                        <svg class="icon" aria-hidden="true"><use href="#i-folder-open" /></svg>
                        <span class="label">Change folder…</span>
                    </button>
                    <button type="button" class="unlink-button" id="btnUnlink">
                        <svg class="icon" aria-hidden="true"><use href="#i-unlink" /></svg>
                        <span class="label">Unlink</span>
                    </button>
                </div>
            </footer>
        </div>

        <div class="modal-backdrop hidden" id="infoModal">
            <div class="modal" role="dialog" aria-modal="true">
                <div class="modal-head">
                    <h2 id="infoTitle">Build information</h2>
                    <button type="button" class="ghost small" id="btnInfoClose">
                        Close
                    </button>
                </div>
                <dl class="info-list">
                    <div class="info-version-row">
                        <dt id="infoVersionLabel">Version</dt>
                        <dd>
                            <!-- Three quick clicks on the version open the
                                 hidden test mode (devel.picstome.com). -->
                            <span class="info-version" id="infoVersion"></span>
                            <button
                                type="button"
                                class="secondary small"
                                id="btnCheckUpdates"
                            >
                                <svg class="icon" aria-hidden="true"><use href="#i-sync" /></svg>
                                <span class="label">Check for updates</span>
                            </button>
                        </dd>
                    </div>
                    <div>
                        <dt id="infoAccountLabel">Account</dt>
                        <dd id="infoAccount"></dd>
                    </div>
                </dl>
                <p class="hint info-update-status" id="updateStatus"></p>
                <!-- Only shown while test mode is active. -->
                <div class="info-mode-action hidden" id="testModeBox">
                    <p class="hint" id="testModeHint"></p>
                    <button
                        type="button"
                        class="secondary small"
                        id="btnTestMode"
                    >
                        Exit test mode
                    </button>
                </div>
            </div>
        </div>

        <div class="modal-backdrop hidden" id="ratingModal">
            <div class="modal rating-modal" role="dialog" aria-modal="true">
                <div class="modal-head">
                    <h2 id="ratingTitle">Rate photos</h2>
                    <button
                        type="button"
                        class="ghost small"
                        id="btnRatingClose"
                    >
                        Close
                    </button>
                </div>
                <p class="hint" id="ratingSubtitle"></p>
                <div class="rating-target" id="ratingTarget"></div>
                <button
                    type="button"
                    class="secondary small hidden"
                    id="btnRatingFolder"
                >
                    Choose folder…
                </button>

<div class="rating-stars" id="ratingStars" role="group">
                    <button type="button" class="star-btn" data-rating="1" aria-label="1">
                        <svg class="icon" aria-hidden="true"><use href="#i-star" /></svg>
                    </button>
                    <button type="button" class="star-btn" data-rating="2" aria-label="2">
                        <svg class="icon" aria-hidden="true"><use href="#i-star" /></svg>
                    </button>
                    <button type="button" class="star-btn" data-rating="3" aria-label="3">
                        <svg class="icon" aria-hidden="true"><use href="#i-star" /></svg>
                    </button>
                    <button type="button" class="star-btn" data-rating="4" aria-label="4">
                        <svg class="icon" aria-hidden="true"><use href="#i-star" /></svg>
                    </button>
                    <button type="button" class="star-btn" data-rating="5" aria-label="5">
                        <svg class="icon" aria-hidden="true"><use href="#i-star" /></svg>
                    </button>
                    <strong id="ratingValue">5</strong>
                </div>

                <div class="rating-result hidden" id="ratingResult"></div>

                <div class="btn-row">
                    <button type="button" class="primary" id="btnRatingApply">
                        Apply rating
                    </button>
                    <button type="button" class="ghost" id="btnRatingCancel">
                        Not now
                    </button>
                </div>
            </div>
        </div>

<div class="modal-backdrop sync-backdrop hidden" id="syncModal">
            <div class="modal sync-modal" role="status" aria-live="polite">
                <div class="sync-modal-icon" aria-hidden="true">
                    <svg class="icon"><use href="#i-sync" /></svg>
                </div>
                <h2 id="syncModalTitle">Syncing…</h2>
                <p class="hint" id="syncModalPhase"></p>
                <div class="sync-modal-bar"><span id="syncModalFill"></span></div>
                <div class="sync-modal-meta">
                    <span id="syncModalFile"></span>
                    <strong id="syncModalPercent"></strong>
                </div>
                <p class="hint" id="syncModalHint"></p>
            </div>
        </div>

        <div class="modal-backdrop hidden" id="confirmModal">
            <div class="modal" role="dialog" aria-modal="true">
                <div class="modal-head">
                    <h2 id="confirmTitle">Confirm</h2>
                </div>
                <p class="hint" id="confirmMessage"></p>
                <div class="btn-row">
                    <button type="button" class="danger" id="btnConfirmOk">
                        Confirm
                    </button>
                    <button
                        type="button"
                        class="secondary hidden"
                        id="btnConfirmAlt"
                    ></button>
                    <button type="button" class="ghost" id="btnConfirmCancel">
                        Cancel
                    </button>
                </div>
            </div>
        </div>

        <div class="modal-backdrop hidden" id="favoritesModal">
            <div class="modal favorites-modal" role="dialog" aria-modal="true">
                <div class="modal-head">
                    <h2 id="favoritesTitle">Export favorite list</h2>
                    <button
                        type="button"
                        class="ghost small"
                        id="btnFavoritesClose"
                    >
                        Close
                    </button>
                </div>
                <p class="hint" id="favoritesSubtitle"></p>

                <input
                    id="favoritesFilter"
                    class="favorites-filter"
                    type="search"
                    autocomplete="off"
                    spellcheck="false"
                />

                <div class="favorites-tabs" id="favoritesTabs">
                    <button
                        type="button"
                        class="favorites-tab"
                        data-tab="lightroom"
                    >
                        Lightroom
                    </button>
                    <button
                        type="button"
                        class="favorites-tab"
                        data-tab="captureone"
                    >
                        Capture One
                    </button>
                    <button
                        type="button"
                        class="favorites-tab"
                        data-tab="finder"
                    >
                        Finder/Explorer
                    </button>
                    <button
                        type="button"
                        class="favorites-tab"
                        data-tab="list"
                    >
                        List
                    </button>
                </div>

                <textarea
                    id="favoritesText"
                    class="favorites-text"
                    readonly
                    rows="7"
                ></textarea>
                <p class="hint" id="favoritesHint"></p>

                <div class="rating-result hidden" id="favoritesResult"></div>

                <div class="btn-row favorites-actions">
                    <button
                        type="button"
                        class="primary"
                        id="btnFavoritesCopy"
                    >
                        Copy
                    </button>
                </div>
            </div>
        </div>

        <script src="./renderer.js"></script>
    </body>
</html>
